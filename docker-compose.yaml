services:
  client_0:
    build:
      context: ./src/
      dockerfile: cmd/client/Dockerfile
    container_name: client_0
    environment:
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - INPUT_FILE_ACCOUNTS=/datasets/accounts_0.csv
    - INPUT_FILE_TRANS=/datasets/transactions_0.csv
    - OUTPUT_FILE_PREFIX=/output/output_0
    volumes:
    - ./datasets:/datasets
    - ./output:/output
