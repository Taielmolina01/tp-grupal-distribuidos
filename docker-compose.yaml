services:
  rabbitmq:
    build:
      context: ./src/cmd/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.4
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
    logging:
      driver: "none"

  gateway:
    build:
      context: ./src/
      dockerfile: cmd/gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ACCOUNTS_CLUSTER_PREFIX=Q2_accounts
      - ACCOUNTS_CLUSTER_AMOUNT=2
      - TRANSFERS_CLUSTERS=Q1234_filter_currency:2,Q5_filter:2
      - RESULTS_QUEUE=results_queue
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - SEQ_CHECKPOINT_EVERY=100
      - PERSIST_FLUSH_INTERVAL=500ms
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - QUERY_EOFS_EXPECTED=1:2,2:2,3:2,4:2,5:1
      - SENDER_TRACKER_CAPACITY=1000000

  client_0:
    build:
      context: ./src/
      dockerfile: cmd/client/Dockerfile
    container_name: client_0
    depends_on:
      - gateway
    environment:
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - INPUT_FILE_ACCOUNTS=/input/accounts_0.csv
      - INPUT_FILE_TRANS=/input/transactions_0.csv
      - OUTPUT_FILE_PREFIX=/output/output_0
      - MAX_BATCH_SIZE=1000
      - MAX_BATCH_KB=128
    volumes:
      - ./input:/input
      - ./output:/output


  # Query 1

  q1234_filter_currency_0:
    build:
      context: ./src/
      dockerfile: cmd/currencyfilter/Dockerfile
    container_name: q1234_filter_currency_0
