      rabbitmq:
        condition: service_healthy
    environment:
      - ID=0
      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_MIDDLEWARE_PREFIX=Q1234_filter_currency
      - OUTPUT_CLUSTERS=Q1_filtered:2,Q2_filtered:2,Q3_filtered:2,Q4_filtered:2
      - CURRENCIES=US Dollar
      - EXPECTED_EOFS=1
      - QUERY_ID=1
      - PERSIST_PATH=/var/bkp/q1234_filter_currency_0
      - PERSIST_BATCH_SIZE=50
      - PERSIST_FLUSH_INTERVAL=1s
      - SENDER_TRACKER_CAPACITY=1000000
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

