  filter_currency_0:
    build:
      context: ./src/
      dockerfile: cmd/filter/Dockerfile
    container_name: filter_currency_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ID=0
      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_EXCHANGE=transfers_exchange
      - INPUT_QUEUE=transfers_queue
      - INPUT_ROUTING_KEYS=TRANSFERS_Q1234_KEY
      - OUTPUT_EXCHANGE=filtered_transfers_exchange
      - OUTPUT_QUEUE=filtered_transfers_q
      - OUTPUT_ROUTING_KEYS=falopa
      - CURRENCIES=US Dollar
      - FILTER_TYPE=CURRENCY
      - FILTER_AMOUNT=2
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

