    - LEFT_INPUT_EXCHANGE=reduced_transfers_q2_exchange
    - LEFT_INPUT_QUEUE=join_q2_transfers_q
    - LEFT_INPUT_ROUTING_KEYS=falopa
    - RIGHT_INPUT_EXCHANGE=accounts_exchange
    - RIGHT_INPUT_QUEUE=join_q2_accounts_q
    - RIGHT_INPUT_ROUTING_KEYS=ACCOUNTS_KEY
    - OUTPUT_EXCHANGE=results_queue
