      context: ./src/
      dockerfile: cmd/currencyfilter/Dockerfile
    container_name: q1234_filter_currency_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ID=0
      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_EXCHANGE=transfers_exchange
      - INPUT_QUEUE=Q1234_transfers_queue
      - INPUT_ROUTING_KEYS=Q1234_TRANSFERS_KEY
      - OUTPUT_EXCHANGE=Q1234_filtered_exchange
      - OUTPUT_QUEUE=Q1234_filtered_q
      - OUTPUT_ROUTING_KEYS=Q1234_filtered_key
      - CURRENCIES=US Dollar
      - FILTER_TYPE=CURRENCY
      - FILTER_AMOUNT=2
      - QUERY_ID=1
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

