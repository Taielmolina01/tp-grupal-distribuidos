    - SERVER_PORT=5678
    - INPUT_FILE_ACCOUNTS=/input/accounts_0.csv
    - INPUT_FILE_TRANS=/input/transactions-FULL.csv
    - OUTPUT_FILE_PREFIX=/output/output_2
    - MAX_BATCH_SIZE=1000
    - LOG_LEVEL=DEBUG
    volumes:
    - ./input:/input
    - ./output:/output 

