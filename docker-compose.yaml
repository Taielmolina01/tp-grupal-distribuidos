      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_EXCHANGE=filtered_transfers_exchange
      - INPUT_QUEUE=filtered_transfers_q
      - INPUT_ROUTING_KEYS=falopa
      - OUTPUT_EXCHANGE=results_queue
      - OUTPUT_QUEUE=results_queue
      - OUTPUT_ROUTING_KEYS=falopa2
