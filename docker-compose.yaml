services:
  rabbitmq:
    build:
      context: ./src/cmd/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.4
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
    logging:
      driver: "none"

  gateway:
    build:
      context: ./src/
      dockerfile: cmd/gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ACCOUNT_QUEUES=filter_account_id_0,filter_account_id_1
      - TRANSFERS_EXCHANGE=transfers_exchange
      - TRANSFERS_ROUTING_KEYS=TRANSFERS_Q5_KEY,TRANSFERS_Q1234_KEY
      - RESULTS_QUEUE=results_queue
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - QUERY_EOFS_EXPECTED=1:1,2:2,3:1,4:2,5:1

  client_0:
    build:
      context: ./src/
      dockerfile: cmd/client/Dockerfile
    container_name: client_0
    depends_on:
      - gateway
    environment:
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - INPUT_FILE_ACCOUNTS=/input/accounts_0.csv
      - INPUT_FILE_TRANS=/input/transactions_0.csv
      - OUTPUT_FILE_PREFIX=/output/output_0
      - MAX_BATCH_SIZE=1000
      - LOG_LEVEL=DEBUG
    volumes:
      - ./input:/input
      - ./output:/output

  client_1:
    build:
      context: ./src/
      dockerfile: cmd/client/Dockerfile
    container_name: client_1
    depends_on:
      - gateway
    environment:
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - INPUT_FILE_ACCOUNTS=/input/accounts_1.csv
      - INPUT_FILE_TRANS=/input/transactions_1.csv
      - OUTPUT_FILE_PREFIX=/output/output_1
      - MAX_BATCH_SIZE=1000
      - LOG_LEVEL=DEBUG
    volumes:
      - ./input:/input
      - ./output:/output

  # Query 1

  filter_currency_0:
    build:
      context: ./src/
      dockerfile: cmd/filter/Dockerfile
    container_name: filter_currency_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ID=0
      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_EXCHANGE=transfers_exchange
      - INPUT_QUEUE=transfers_queue_q1234
      - INPUT_ROUTING_KEYS=TRANSFERS_Q1234_KEY
      - OUTPUT_EXCHANGE=filtered_transfers_exchange
      - OUTPUT_QUEUE=filtered_transfers_q
      - OUTPUT_ROUTING_KEYS=falopa
      - CURRENCIES=US Dollar
      - FILTER_TYPE=CURRENCY
      - FILTER_AMOUNT=2
      - QUERY_ID=1
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  filter_currency_1:
    build:
      context: ./src/
      dockerfile: cmd/filter/Dockerfile
    container_name: filter_currency_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ID=1
      - MOM_PORT=5672
      - MOM_HOST=rabbitmq
      - INPUT_EXCHANGE=transfers_exchange
      - INPUT_QUEUE=transfers_queue_q1234
      - INPUT_ROUTING_KEYS=TRANSFERS_Q1234_KEY
      - OUTPUT_EXCHANGE=filtered_transfers_exchange
      - OUTPUT_QUEUE=filtered_transfers_q
      - OUTPUT_ROUTING_KEYS=falopa
      - CURRENCIES=US Dollar
      - FILTER_TYPE=CURRENCY
      - FILTER_AMOUNT=2
      - QUERY_ID=1
